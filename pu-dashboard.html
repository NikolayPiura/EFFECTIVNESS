<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ПЮ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0a0c12;--bg2:#11141c;--bg3:#171b25;--bg4:#202635;
  --brd:rgba(255,255,255,0.06);--brd2:rgba(255,255,255,0.13);
  --tx:#d8dee8;--mu:#4a566a;--mu2:#6b7990;--mu3:#94a2b8;
  --g:#3ddba0;--b:#5b9dff;--r:#ff6b85;--y:#f0c84e;
  --fontsize:28px;--fontfamily:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:var(--fontsize);}
body{background:var(--bg);color:var(--tx);font-family:var(--fontfamily);}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(61,219,160,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(61,219,160,0.01) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,12,18,0.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd2);height:110px;display:flex;align-items:stretch;}
.top-logo{font-family:'Orbitron',sans-serif;font-weight:700;font-size:2.375rem;letter-spacing:3px;padding:0 32px;display:flex;align-items:center;border-right:1px solid var(--brd2);white-space:nowrap;}
.top-logo span{color:var(--g);}
.tabs{display:flex;flex:1;overflow:hidden;}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:1.375rem;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--mu2);cursor:pointer;border-right:1px solid var(--brd);border-bottom:4px solid transparent;transition:all .2s;text-align:center;padding:0 10px;white-space:nowrap;}
.tab:hover{color:var(--tx);}
.tab.act{color:#fff;border-bottom-color:var(--tc);background:rgba(255,255,255,0.015);}
.tab.overview{flex:0.8;}
.top-right{display:flex;align-items:center;gap:14px;padding:0 26px;border-left:1px solid var(--brd2);}
#sync{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--mu2);white-space:nowrap;}
#sync.live{color:var(--g);}#sync.err{color:var(--r);}
#settbtn,#rbtn{background:transparent;border:1px solid var(--brd2);border-radius:8px;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:1.25rem;padding:8px 16px;cursor:pointer;transition:all .2s;}
#settbtn:hover{border-color:var(--y);color:var(--y);}
#rbtn:hover{border-color:var(--g);color:var(--g);}

/* PAGE */
.pg{padding:170px 4vw 100px;position:relative;z-index:1;width:100%;}
.sec{margin-bottom:96px;}
.sec:last-child{margin-bottom:0;}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:36px;cursor:pointer;user-select:none;}
.sh.static{cursor:default;}
.sn{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--g);letter-spacing:3px;opacity:0.85;}
.st{font-family:'Orbitron',sans-serif;font-size:1.188rem;font-weight:600;letter-spacing:1.5px;color:var(--mu3);}
.sl{flex:1;height:1px;background:linear-gradient(90deg,var(--brd2),transparent);}
.chev{font-family:'JetBrains Mono',monospace;font-size:1.062rem;color:var(--mu2);transition:transform .25s;}
.chev.open{transform:rotate(90deg);}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:48px 52px;}
.collapsible{display:none;}
.collapsible.open{display:block;}

/* CHART */
.chart-head{display:flex;justify-content:flex-end;align-items:center;margin-bottom:28px;}
.mbtn{background:transparent;border:1px solid var(--brd2);border-radius:50%;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:1.062rem;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.mbtn:hover,.mbtn.on{border-color:var(--y);color:var(--y);}
.chart-box{position:relative;height:400px;}
.manual-row{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:28px;padding-top:28px;border-top:1px solid var(--brd);}
.mc{display:flex;flex-direction:column;align-items:center;gap:5px;}
.mc-lbl{font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--mu2);}
.mc-inp{width:100%;background:var(--bg3);border:1px solid var(--brd);border-radius:5px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:0.938rem;text-align:center;padding:6px 1px;outline:none;}
.mc-inp:focus{border-color:var(--y);}
.mc-inp:disabled{opacity:0.4;cursor:not-allowed;}

/* TIME/INCOME — generous spacing */
.period-switch{display:flex;gap:0.875rem;margin-bottom:2.25rem;}
.period-btn{background:var(--bg3);border:1px solid var(--brd2);border-radius:0.625rem;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:600;padding:0.875rem 1.75rem;cursor:pointer;transition:all .2s;}
.period-btn:hover{border-color:var(--mu3);color:var(--tx);}
.period-btn.sel{background:var(--g);border-color:var(--g);color:#0a0c12;}
.ti-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-bottom:44px;}
.ti-box{background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:48px 52px;position:relative;overflow:hidden;}
.ti-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;}
.ti-box.tcolor::before{background:var(--b);opacity:0.7;}
.ti-box.icolor::before{background:var(--y);opacity:0.7;}
.ti-lbl{font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--mu2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:24px;}
.ti-val{font-family:'Orbitron',sans-serif;font-size:3.75rem;font-weight:700;line-height:1;}

.dph-block{text-align:center;padding:48px 0;}
.dph-val{font-family:'Orbitron',sans-serif;font-size:5rem;font-weight:800;line-height:1;cursor:pointer;display:inline-block;transition:opacity .15s;}
.dph-val:hover{opacity:0.8;}
.dph-sep{font-family:'JetBrains Mono',monospace;font-size:2.5rem;color:var(--mu);}
.dph-tgt{font-family:'Orbitron',sans-serif;font-size:3.125rem;font-weight:600;color:var(--mu3);}
.dph-hint{font-family:'JetBrains Mono',monospace;font-size:0.812rem;color:var(--mu);margin-top:20px;letter-spacing:0.5px;}

/* Q&A */
.qa-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--bg2);border:1px solid var(--brd);border-radius:12px;overflow:hidden;}
.qa-col{padding:52px 56px;}
.qa-col:first-child{border-right:1px solid var(--brd2);}
.qa-head{display:flex;align-items:center;gap:16px;margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid var(--brd2);}
.qa-title{font-family:'Orbitron',sans-serif;font-size:1.062rem;font-weight:600;letter-spacing:1.2px;color:var(--mu3);}
.qa-add{background:transparent;border:1px solid var(--brd2);border-radius:6px;width:36px;height:36px;cursor:pointer;font-size:1.375rem;display:flex;align-items:center;justify-content:center;color:var(--mu3);transition:all .2s;flex-shrink:0;line-height:1;}
.qa-add:hover{border-color:var(--g);color:var(--g);}
.qa-ebtn{background:transparent;border:none;color:var(--mu);cursor:pointer;font-size:1.125rem;margin-left:auto;padding:0;transition:color .2s;}
.qa-ebtn:hover,.qa-ebtn.on{color:var(--y);}
.qi{display:flex;align-items:flex-start;gap:18px;padding:24px 0;border-bottom:1px solid var(--brd);}
.qi:last-child{border-bottom:none;}
.qi-cb{width:26px;height:26px;border:2px solid var(--brd2);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.875rem;color:transparent;flex-shrink:0;margin-top:3px;transition:all .2s;}
.qi-cb.on{background:var(--g);border-color:var(--g);color:#0a0c12;}
.qi-num{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--mu);min-width:26px;margin-top:2px;}
.qi-txt{font-size:1.312rem;font-weight:450;line-height:1.5;color:var(--tx);flex:1;outline:none;word-break:break-word;}
.qi-txt[contenteditable=true]:empty::before{content:attr(data-ph);color:var(--mu);}
.qi.done .qi-txt{text-decoration:line-through;color:var(--mu2);}
.qi-del{background:transparent;border:none;color:transparent;cursor:pointer;font-size:0.938rem;flex-shrink:0;transition:color .2s;padding:0;margin-top:4px;}
.qi:hover .qi-del{color:var(--mu);}
.qi-del:hover{color:var(--r) !important;}
.qi-empty{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--mu);padding:20px 0;}

/* BOTTOM */
.bbar{display:flex;align-items:center;gap:20px;background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:26px 36px;}
.bb-ta{flex:1;background:transparent;border:none;color:var(--tx);font-family:var(--fontfamily);font-size:1.062rem;outline:none;resize:none;height:34px;line-height:1.5;}
.bb-ta::placeholder{color:var(--mu);}
.bb-sep{width:1px;height:30px;background:var(--brd2);flex-shrink:0;}
.bb-files{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.bb-chip{background:var(--bg3);border:1px solid var(--brd);border-radius:6px;padding:6px 16px;font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--mu3);cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .2s;}
.bb-chip:hover{border-color:var(--b);color:var(--b);}
.bb-cdel{color:var(--mu);cursor:pointer;}
.bb-cdel:hover{color:var(--r);}
.bb-add{background:transparent;border:1px dashed var(--brd2);border-radius:6px;padding:6px 18px;font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--mu2);cursor:pointer;transition:all .2s;white-space:nowrap;}
.bb-add:hover{border-color:var(--b);color:var(--b);}

/* OVERVIEW */
.ov-summary{background:radial-gradient(circle at 30% 20%, rgba(61,219,160,0.06), transparent 60%),var(--bg2);border:1px solid var(--brd);border-radius:16px;padding:64px 60px;margin-bottom:80px;text-align:center;}
.ov-summary-val{font-family:'Orbitron',sans-serif;font-size:5.5rem;font-weight:800;line-height:1;}
.ov-summary-sub{font-family:'JetBrains Mono',monospace;font-size:0.938rem;color:var(--mu2);margin-top:18px;letter-spacing:0.5px;}

.ov-list{display:flex;flex-direction:column;gap:28px;}
.ov-row{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:44px 52px;display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:36px;align-items:center;position:relative;overflow:hidden;transition:border-color .2s;}
.ov-row:hover{border-color:var(--brd2);}
.ov-row::before{content:'';position:absolute;top:0;left:0;bottom:0;width:5px;background:var(--oc,var(--mu));}
.ov-row-name{font-family:'Orbitron',sans-serif;font-size:1.375rem;font-weight:600;}
.ov-row-dph{cursor:pointer;transition:opacity .15s;}
.ov-row-dph:hover{opacity:0.8;}
.ov-row-dph-val{font-family:'Orbitron',sans-serif;font-size:3rem;font-weight:800;line-height:1;}
.ov-row-dph-of{font-family:'JetBrains Mono',monospace;font-size:1.125rem;color:var(--mu3);}
.ov-row-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ov-row-tile{background:var(--bg3);border:1px solid var(--brd);border-radius:10px;padding:16px 20px;}
.ov-row-tile-lbl{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--mu2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.ov-row-tile-val{font-family:'JetBrains Mono',monospace;font-size:1.125rem;font-weight:700;}

.ov-circle-section{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;}
.ov-circle-card{background:var(--bg2);border:1px solid var(--brd);border-radius:16px;padding:56px 60px;display:flex;flex-direction:column;align-items:center;}
.ov-circle-title{font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--mu2);text-transform:uppercase;letter-spacing:2px;margin-bottom:40px;}
.ov-circle-wrap{position:relative;width:100%;max-width:380px;}
.ov-circle-box{position:relative;height:340px;}
.ov-circle-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ov-circle-center-val{font-family:'Orbitron',sans-serif;font-size:2.25rem;font-weight:700;color:var(--tx);}
.ov-circle-center-lbl{font-family:'JetBrains Mono',monospace;font-size:0.688rem;color:var(--mu2);margin-top:4px;letter-spacing:1px;}
.ov-circle-legend{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;margin-top:44px;width:100%;}
.ov-circle-leg-item{display:flex;align-items:center;gap:12px;}
.ov-circle-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
.ov-circle-leg-text{display:flex;flex-direction:column;}
.ov-circle-leg-name{font-size:0.938rem;color:var(--mu3);}
.ov-circle-leg-val{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:600;}

.ov-mini-stack{display:flex;flex-direction:column;gap:24px;width:100%;}
.ov-mini-card{background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:28px 32px;}
.ov-mini-title{font-family:'JetBrains Mono',monospace;font-size:0.812rem;color:var(--mu2);text-transform:uppercase;letter-spacing:1.3px;margin-bottom:16px;}
.ov-mini-rows{display:flex;flex-direction:column;gap:10px;}
.ov-mini-row{display:flex;justify-content:space-between;align-items:baseline;}
.ov-mini-name{font-size:0.938rem;color:var(--mu3);}
.ov-mini-val{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:600;}

@media (max-width: 1100px){
  .ov-circle-section{grid-template-columns:1fr;}
  .ov-row{grid-template-columns:1fr;text-align:left;gap:20px;}
  .ov-row-tiles{grid-template-columns:1fr 1fr;}
}

/* HISTORY MODAL */
#histmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:600;align-items:center;justify-content:center;}
#histmodal.on{display:flex;}
.hist-box{background:var(--bg2);border:1px solid var(--brd2);border-radius:16px;padding:56px 60px;width:92%;max-width:980px;}
.hist-title{font-family:'Orbitron',sans-serif;font-size:1.375rem;font-weight:600;margin-bottom:10px;}
.hist-sub{font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--mu2);margin-bottom:40px;}
.hist-chart-box{position:relative;height:380px;}
.hist-close{margin-top:36px;width:100%;background:transparent;border:1px solid var(--brd2);border-radius:10px;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:1rem;padding:16px;cursor:pointer;transition:all .2s;}
.hist-close:hover{border-color:var(--mu3);color:var(--tx);}

/* SETTINGS MODAL */
#settmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:500;align-items:center;justify-content:center;overflow-y:auto;padding:40px 0;}
#settmodal.on{display:flex;}
.sett-box{background:var(--bg2);border:1px solid var(--brd2);border-radius:16px;padding:48px 52px;width:90%;max-width:760px;}
.sett-title{font-family:'Orbitron',sans-serif;font-size:1.375rem;font-weight:600;margin-bottom:36px;}
.sett-row{margin-bottom:32px;}
.sett-lbl{font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--mu2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px;}
.sett-opts{display:flex;gap:12px;flex-wrap:wrap;}
.sett-opt{background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;padding:12px 20px;font-family:'JetBrains Mono',monospace;font-size:0.938rem;color:var(--mu3);cursor:pointer;transition:all .2s;}
.sett-opt:hover{border-color:var(--mu3);}
.sett-opt.sel{background:var(--g);border-color:var(--g);color:#0a0c12;font-weight:600;}
.sett-num,.sett-text{width:100%;background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:1.125rem;padding:12px 16px;outline:none;}
.sett-num{width:140px;}
.sett-num:focus,.sett-text:focus{border-color:var(--y);}
.sett-close{width:100%;background:var(--g);border:none;border-radius:10px;color:#0a0c12;font-family:'Orbitron',sans-serif;font-size:1.062rem;font-weight:600;padding:18px;cursor:pointer;margin-top:24px;transition:all .2s;}
.sett-close:hover{filter:brightness(1.08);}
.sett-reorder{display:flex;flex-direction:column;gap:10px;}
.sett-reorder-item{background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:grab;font-family:'Inter',sans-serif;font-size:1rem;}
.sett-reorder-item:active{cursor:grabbing;}
.sett-reorder-handle{color:var(--mu);font-size:1.125rem;}
.sett-reorder-item.dragging{opacity:0.4;}

#imodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center;cursor:pointer;}
#imodal.on{display:flex;}
#imodal img{max-width:92vw;max-height:92vh;border:1px solid var(--brd2);border-radius:8px;}
#file-in{display:none;}
</style>
</head>
<body>
<div id="topbar">
  <div class="top-logo" id="top-logo-text">П<span>Ю</span></div>
  <div class="tabs" id="tabs-bar"></div>
  <div class="top-right">
    <span id="sync">● —</span>
    <button id="settbtn" onclick="openSettings()">⚙</button>
    <button id="rbtn" onclick="loadAll()">↻</button>
  </div>
</div>
<div class="pg" id="pg"></div>

<div id="settmodal">
  <div class="sett-box">
    <div class="sett-title">⚙ Настройки</div>

    <div class="sett-row">
      <div class="sett-lbl">Целевой $/час (ИК)</div>
      <input type="number" class="sett-num" id="opt-targetdph" value="500">
    </div>

    <div class="sett-row">
      <div class="sett-lbl">Название (топбар)</div>
      <input type="text" class="sett-text" id="opt-logotext" maxlength="6" placeholder="ПЮ">
    </div>

    <div class="sett-row">
      <div class="sett-lbl">Размер шрифта</div>
      <div class="sett-opts" id="opt-fontsize"></div>
    </div>

    <div class="sett-row">
      <div class="sett-lbl">Шрифт текста</div>
      <div class="sett-opts" id="opt-fontfamily"></div>
    </div>

    <div class="sett-row">
      <div class="sett-lbl">Порядок вкладок (потяни, чтобы поменять)</div>
      <div class="sett-reorder" id="opt-taborder"></div>
    </div>

    <button class="sett-close" onclick="closeSettings()">Готово</button>
  </div>
</div>

<div id="histmodal">
  <div class="hist-box">
    <div class="hist-title" id="hist-title">История $/час</div>
    <div class="hist-sub" id="hist-sub"></div>
    <div class="hist-chart-box"><canvas id="hist-chart"></canvas></div>
    <button class="hist-close" onclick="closeHist()">Закрыть</button>
  </div>
</div>

<div id="imodal" onclick="closeModal()"><img id="modal-img" src="" alt=""></div>
<input type="file" id="file-in" accept="image/*" multiple>

<script>
const INCOME_URL='https://script.google.com/macros/s/AKfycbxjg9I0W6r8slpuex8yvQIqO3BR9k9NS6h5grvqLVMN0Wjn7iT_1drEOXT2Sn93Y_x_/exec';
const TIME_URL='https://script.google.com/macros/s/AKfycbxnd2ZyN7B6YzVvIH6wp8Uer5tNqG7OFV20Av7xmCqUrEHH3rREj6AfjDwRBsW_hahAPg/exec';
const SK='pu_v8';
const MO=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

const FIXED_2025={
  inv:  {Июл:33950, Авг:20594, Сен:7050, Окт:7537,  Ноя:11972, Дек:11868},
  money:{Июл:102,   Авг:92,    Сен:155,  Окт:1274,  Ноя:1214,  Дек:812},
  nav:  {Июл:10843, Авг:5106,  Сен:5552, Окт:10226, Ноя:11094, Дек:11159},
  klim: {Июл:9867,  Авг:1782,  Сен:5065, Окт:6319,  Ноя:4976,  Дек:3664},
};

const ALL_TABS=[
  {id:'inv',  name:'Инвестиции',         color:'#5b9dff',cat:'Инвестиции',        tk:'inv'},
  {id:'money',name:'Управление деньгами',color:'#f0c84e',cat:'Управление деньгами',tk:'money'},
  {id:'nav',  name:'Наставничество',     color:'#a87dff',cat:'Наставничество',     tk:'nav'},
  {id:'klim', name:'Климат',             color:'#3ddba0',cat:'Климат',             tk:'klim'},
];

// ── TIME DATA ──
async function loadTimeData(){
  try{
    const r=await fetch(TIME_URL);
    const j=await r.json();
    if(j.status==='ok'&&j.days){
      const obj={};
      j.days.forEach(d=>{
        obj[d.date]={
          klim: d['Климат']||0,
          inv: d['Инвестиции']||0,
          money: d['Управление деньгами']||0,
          nav: d['Наставник']||0,
        };
      });
      timeData=obj;
      const keys=Object.keys(obj).sort();
      if(keys.length>=2){
        const first=new Date(keys[0]+'T00:00:00');
        const last=new Date(keys[keys.length-1]+'T00:00:00');
        timeDayCount=Math.max(1,Math.round((last-first)/86400000)+1);
      } else {
        timeDayCount=Math.max(1,keys.length);
      }
    }
  }catch(e){ timeData=null; }
}
function getTime(){return timeData||{};}

function timeStatsFor(tk){
  const tt=getTime();
  const keys=Object.keys(tt).sort();
  let totalMins=0;
  keys.forEach(k=>{ totalMins+=(tt[k]?.[tk]||0); });
  const days=timeDayCount||Math.max(1,keys.length);
  const avgMinDay=days>0?totalMins/days:0;
  return{
    days,
    totalH:(totalMins/60),
    avgHDay:avgMinDay/60,
    avgHWeek:(avgMinDay/60)*7,
    avgHMonth:(avgMinDay/60)*30,
  };
}

const VIEW_PERIODS={
  day:  {label:'День',   mult:1},
  week: {label:'Неделя', mult:7},
  month:{label:'Месяц',  mult:30},
  year: {label:'Год',    mult:365},
};
let viewPeriod={};
function getViewPeriod(tid){return viewPeriod[tid]||'week';}
function setViewPeriod(tid,p){viewPeriod[tid]=p;renderPage();}

function getSliding12(){
  const now=new Date(),res=[];
  for(let i=11;i>=0;i--){let m=now.getMonth()-i,y=now.getFullYear();if(m<0){m+=12;y--;}res.push({key:MO[m],year:y,label:MO[m]+(y!==now.getFullYear()?"'"+String(y).slice(2):'')});}
  return res;
}
function getCat(name){
  if(!incomeData?.sources?.categories)return null;
  return incomeData.sources.categories.find(c=>c.name.toUpperCase().indexOf(name.split(' ')[0].toUpperCase())!==-1)||null;
}
function fmt(v){if(!v&&v!==0)return'—';return'$'+Math.round(v).toLocaleString('ru');}

function getMonthValue(tab,monthKey,year,remote,manual){
  if(manual[monthKey]!==undefined)return manual[monthKey];
  if(year===2025 && FIXED_2025[tab.tk] && FIXED_2025[tab.tk][monthKey]!==undefined){
    return FIXED_2025[tab.tk][monthKey];
  }
  return remote[monthKey]||0;
}

// average monthly income = mean of all 12 sliding points (months without data count as 0)
function getTabData(tab){
  const sliding=getSliding12();
  const cat=getCat(tab.cat);
  const remote=cat?cat.months:{};
  const total=cat?(cat.total||0):0;
  const tdata=td(tab.id);
  const manual=tdata.manual||{};
  const vals=sliding.map(s=>getMonthValue(tab,s.key,s.year,remote,manual));

  const ts=timeStatsFor(tab.tk);
  const avgMonthlyIncome=vals.reduce((a,b)=>a+(b||0),0)/vals.length;
  const hoursPerMonth=ts.avgHDay*30;
  const dph=hoursPerMonth>0?Math.round(avgMonthlyIncome/hoursPerMonth):0;

  const period=getViewPeriod(tab.id);
  const mult=VIEW_PERIODS[period].mult;
  const periodHours=ts.avgHDay*mult;
  const periodIncome=(avgMonthlyIncome/30)*mult;

  return{sliding,vals,total,ts,avgMonthlyIncome,hoursPerMonth,dph,manual,remote,period,periodHours,periodIncome};
}

// ── $/h history — cumulative average up to each point ──
function getDphHistory(tab){
  const sliding=getSliding12();
  const cat=getCat(tab.cat);
  const remote=cat?cat.months:{};
  const tdata=td(tab.id);
  const manual=tdata.manual||{};
  const ts=timeStatsFor(tab.tk);
  const hoursPerMonth=ts.avgHDay*30;

  const monthVals=sliding.map(s=>getMonthValue(tab,s.key,s.year,remote,manual));
  let runningSum=0;
  return sliding.map((s,i)=>{
    runningSum+=monthVals[i];
    const n=i+1;
    const avgIncomeSoFar=runningSum/n;
    const dph=hoursPerMonth>0?Math.round(avgIncomeSoFar/hoursPerMonth):0;
    return{label:s.label,dph,hasData:monthVals[i]>0||runningSum>0};
  });
}

function drawChartForTab(tid){
  const tab=ALL_TABS.find(t=>t.id===tid);
  if(!tab)return;
  const {sliding,vals}=getTabData(tab);
  const maxData=Math.max(...vals,0);
  const maxVal=maxData>0?maxData*1.25:1000;
  drawChart(sliding.map(s=>s.label),vals,tab.color,maxVal);
}

function drawChart(labels,vals,color,maxVal){
  if(mainChart){mainChart.destroy();mainChart=null;}
  const ctx=document.getElementById('ch-main');if(!ctx)return;
  let lastIdx=-1;vals.forEach((v,i)=>{if(v>0)lastIdx=i;});
  const dv=vals.map((v,i)=>i<=lastIdx?(v||0):null);
  mainChart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{data:dv,borderColor:color,backgroundColor:color+'12',fill:true,tension:0.3,
      pointRadius:dv.map(v=>v!==null?6:0),pointBackgroundColor:color,pointBorderColor:color,
      pointHoverRadius:8,borderWidth:2.5,spanGaps:false}]},
    plugins:[{id:'lbl',afterDatasetsDraw(chart){
      const ds=chart.data.datasets[0],meta=chart.getDatasetMeta(0),c2=chart.ctx;
      meta.data.forEach((pt,i)=>{
        const v=ds.data[i];if(v===null||v===0)return;
        c2.save();c2.font="600 13px 'JetBrains Mono'";c2.fillStyle=color;c2.textAlign='center';
        c2.fillText('$'+(v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)),pt.x,pt.y-14);c2.restore();
      });
    }}],
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw!==null?' $'+Math.round(c.raw).toLocaleString('ru'):''}}},
      scales:{
        x:{ticks:{color:'#6b7990',font:{family:'JetBrains Mono',size:13}},grid:{color:'rgba(255,255,255,0.035)'},border:{color:'rgba(255,255,255,0.07)'}},
        y:{min:0,suggestedMax:maxVal,ticks:{color:'#6b7990',font:{family:'JetBrains Mono',size:12},callback:v=>'$'+(v>=1000?(v/1000).toFixed(0)+'k':v)},grid:{color:'rgba(255,255,255,0.035)'},border:{color:'rgba(255,255,255,0.07)'}}
      }
    }
  });
}

  if(!arr.length){el.innerHTML=`<div class="qi-empty">— пусто</div>`;return;}
  arr.forEach((item,i)=>{
    const div=document.createElement('div');div.className='qi'+(item.done?' done':'');
    div.innerHTML=`
      <div class="qi-cb${item.done?' on':''}" onclick="toggleDone('${tid}','${type}',${i})">✓</div>
      <span class="qi-num">${i+1}.</span>
      <div class="qi-txt" contenteditable="${edit}" data-ph="${type==='q'?'Вопрос...':'Задача...'}" onblur="saveText('${tid}','${type}',${i},this.textContent)">${item.text||''}</div>
      ${edit?`<button class="qi-del" onclick="delItem('${tid}','${type}',${i})">✕</button>`:''}
    `;
    el.appendChild(div);
  });
}
function addItem(tid,type){
  const d=td(tid);
  if(type==='q'){if(!d.q)d.q=[];d.q.push({text:'',done:false});}
  else{if(!d.t)d.t=[];d.t.push({text:'',done:false});}
  stab(tid,d);editMode[tid+type]=true;
  const btn=document.getElementById((type==='q'?'qedit':'tedit')+'-'+tid);if(btn)btn.classList.add('on');
  renderQ(tid,type);
  setTimeout(()=>{const el=document.getElementById((type==='q'?'qlist':'tlist')+'-'+tid);if(el){const its=el.querySelectorAll('.qi-txt');if(its.length)its[its.length-1].focus();}},30);
}
function delItem(tid,type,i){const d=td(tid);(type==='q'?d.q:d.t).splice(i,1);stab(tid,d);renderQ(tid,type);}
function toggleDone(tid,type,i){const d=td(tid);const a=type==='q'?d.q:d.t;a[i].done=!a[i].done;stab(tid,d);renderQ(tid,type);}
function saveText(tid,type,i,txt){const d=td(tid);const a=type==='q'?d.q:d.t;if(a[i])a[i].text=txt.trim();stab(tid,d);}

// ── FILES ──
function trigUpload(tid){uploadTab=tid;document.getElementById('file-in').click();}
document.getElementById('file-in').addEventListener('change',function(e){
  const tid=uploadTab;if(!tid)return;
  Array.from(e.target.files).forEach(file=>{const r=new FileReader();r.onload=ev=>{const d=td(tid);if(!d.files)d.files=[];d.files.push({name:file.name,data:ev.target.result});stab(tid,d);renderFiles(tid);};r.readAsDataURL(file);});
  this.value='';
});
function renderFiles(tid){
  const el=document.getElementById('bb-files');if(!el)return;
  const d=td(tid);el.innerHTML='';
  (d.files||[]).forEach((f,i)=>{
    const ch=document.createElement('div');ch.className='bb-chip';
    ch.innerHTML=`📎 ${f.name} <span class="bb-cdel" onclick="delFile('${tid}',${i},event)">✕</span>`;
    ch.addEventListener('click',ev=>{if(!ev.target.classList.contains('bb-cdel'))openModal(f.data);});
    el.appendChild(ch);
  });
}
function delFile(tid,i,e){e.stopPropagation();const d=td(tid);d.files.splice(i,1);stab(tid,d);renderFiles(tid);}
function openModal(src){document.getElementById('modal-img').src=src;document.getElementById('imodal').classList.add('on');}
function closeModal(){document.getElementById('imodal').classList.remove('on');}

// ── OVERVIEW TAB ──
let ovCircles={};
function renderOverview(){
  const pg=document.getElementById('pg');pg.innerHTML='';
  Object.values(ovCircles).forEach(c=>c.destroy());ovCircles={};

  const target=SETTINGS.targetDph;
  let totalDphSum=0,totalCount=0,totalIncomeAll=0;
  const tabStats=ALL_TABS.map(tab=>{
    const data=getTabData(tab);
    totalDphSum+=data.dph;totalCount++;
    totalIncomeAll+=data.total;
    return{tab,data};
  });
  const avgDph=Math.round(totalDphSum/totalCount);

  const summary=document.createElement('div');summary.className='ov-summary';
  summary.innerHTML=`
    <div class="ov-summary-val" style="color:${avgDph>=target?'#3ddba0':'#ff6b85'}">${fmt(avgDph)} <span style="color:var(--mu3);font-size:50px">/ ${fmt(target)}</span></div>
    <div class="ov-summary-sub">средний $/час по всем направлениям · ${fmt(totalIncomeAll)} доход за год</div>
  `;
  pg.appendChild(summary);

  const sh=document.createElement('div');sh.className='sh static';
  sh.innerHTML=`<span class="sn">// 01</span><span class="st">ПО НАПРАВЛЕНИЯМ</span><div class="sl"></div>`;
  pg.appendChild(sh);

  const list=document.createElement('div');list.className='ov-list';
  tabStats.forEach(({tab,data})=>{
    const ec=data.dph>=target?'#3ddba0':data.dph>=target*0.6?tab.color:'#ff6b85';
    const row=document.createElement('div');row.className='ov-row';
    row.style.setProperty('--oc',tab.color);
    row.innerHTML=`
      <div class="ov-row-name" style="color:${tab.color}">${tab.name}</div>
      <div class="ov-row-dph" onclick="openHist('${tab.id}')">
        <div class="ov-row-dph-val" style="color:${ec}">${fmt(data.dph)} <span class="ov-row-dph-of">/ ${fmt(target)}</span></div>
      </div>
      <div class="ov-row-tiles">
        <div class="ov-row-tile"><div class="ov-row-tile-lbl">Доход/мес</div><div class="ov-row-tile-val" style="color:${tab.color}">${fmt(data.avgMonthlyIncome)}</div></div>
        <div class="ov-row-tile"><div class="ov-row-tile-lbl">Доход/год</div><div class="ov-row-tile-val" style="color:${tab.color}">${fmt(data.total)}</div></div>
        <div class="ov-row-tile"><div class="ov-row-tile-lbl">Время/нед</div><div class="ov-row-tile-val" style="color:var(--b)">${data.ts.avgHWeek.toFixed(1)}ч</div></div>
        <div class="ov-row-tile"><div class="ov-row-tile-lbl">Время/мес</div><div class="ov-row-tile-val" style="color:var(--b)">${data.ts.avgHMonth.toFixed(1)}ч</div></div>
      </div>
    `;
    list.appendChild(row);
  });
  pg.appendChild(list);

  // ── circles section ──
  const sh2=document.createElement('div');sh2.className='sh static';
  sh2.style.marginTop='96px';
  sh2.innerHTML=`<span class="sn">// 02</span><span class="st">РАСПРЕДЕЛЕНИЕ</span><div class="sl"></div>`;
  pg.appendChild(sh2);

  const circSec=document.createElement('div');circSec.className='ov-circle-section';
  const totalTimeAll=tabStats.reduce((a,{data})=>a+data.ts.avgHDay,0);

  // big donut: time
  const timeCard=document.createElement('div');timeCard.className='ov-circle-card';
  timeCard.innerHTML=`
    <div class="ov-circle-title">ВРЕМЯ — ЧАСОВ В ДЕНЬ</div>
    <div class="ov-circle-wrap">
      <div class="ov-circle-box"><canvas id="ov-circ-time"></canvas>
        <div class="ov-circle-center">
          <div class="ov-circle-center-val">${totalTimeAll.toFixed(1)}ч</div>
          <div class="ov-circle-center-lbl">ВСЕГО/ДЕНЬ</div>
        </div>
      </div>
      <div class="ov-circle-legend">
        ${tabStats.map(({tab,data})=>{
          const pctShare=totalTimeAll>0?(data.ts.avgHDay/totalTimeAll*100).toFixed(0):0;
          return `<div class="ov-circle-leg-item"><span class="ov-circle-dot" style="background:${tab.color}"></span><div class="ov-circle-leg-text"><span class="ov-circle-leg-name">${tab.name}</span><span class="ov-circle-leg-val" style="color:${tab.color}">${data.ts.avgHDay.toFixed(1)}ч (${pctShare}%)</span></div></div>`;
        }).join('')}
      </div>
    </div>
  `;
  circSec.appendChild(timeCard);

  // mini stack: income share as compact bars + numbers (alternative to second donut for visual variety)
  const incomeStack=document.createElement('div');incomeStack.className='ov-circle-card';
  incomeStack.innerHTML=`
    <div class="ov-circle-title">ДОХОД — ЗА ГОД</div>
    <div class="ov-mini-stack">
      ${tabStats.map(({tab,data})=>{
        const pctShare=totalIncomeAll>0?(data.total/totalIncomeAll*100):0;
        return `<div class="ov-mini-card">
          <div class="ov-mini-title" style="color:${tab.color}">${tab.name}</div>
          <div class="ov-mini-rows">
            <div class="ov-mini-row"><span class="ov-mini-name">Доход</span><span class="ov-mini-val" style="color:${tab.color}">${fmt(data.total)}</span></div>
            <div class="ov-mini-row"><span class="ov-mini-name">Доля</span><span class="ov-mini-val">${pctShare.toFixed(0)}%</span></div>
          </div>
          <div style="background:var(--bg4);height:8px;border-radius:4px;overflow:hidden;margin-top:14px;">
            <div style="height:100%;width:${pctShare}%;background:${tab.color};border-radius:4px;"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  circSec.appendChild(incomeStack);
  pg.appendChild(circSec);

  setTimeout(()=>{
    const timeLabels=tabStats.map(s=>s.tab.name);
    const timeVals=tabStats.map(s=>s.data.ts.avgHDay);
    const colors=tabStats.map(s=>s.tab.color);
    ovCircles.time=new Chart(document.getElementById('ov-circ-time'),{
      type:'doughnut',
      data:{labels:timeLabels,datasets:[{data:timeVals,backgroundColor:colors,borderWidth:0,borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'72%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw.toFixed(1)}ч/день`}}}}
    });
  },30);
}

// ── LOAD ──
async function loadIncome(){
  const b=document.getElementById('sync');b.textContent='● СИНХР...';b.className='';
  try{const r=await fetch(INCOME_URL);incomeData=await r.json();b.textContent='● LIVE';b.className='live';}
  catch{b.textContent='● ОШИБКА';b.className='err';}
}

async function loadAll(){
  await Promise.all([loadIncome(), loadTimeData()]);
  renderPage();
}
applySettings();buildTabs();loadAll();setInterval(loadAll,5*60*1000);
</script>
</body>
